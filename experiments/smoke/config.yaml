name: smoke
device: cpu
data:
  conditions: [age, sex]
model:
  latent_channels: 4
  latent_spatial: [2, 2, 2]
  backbone_hidden_features: 16
  backbone_hidden_layers: 2
  head_hidden_features: 16
  head_num_layers: 2
train:
  epochs: 2
  batch_size: 2
  points: 64
  num_workers: 0
  mixed_precision: false
  save_every: 1
validation:
  max_samples: 1
  fit_steps: 2
  fit_points: 64
inference:
  fit_steps: 3
  fit_points: 64
  chunk_size: 256
  data_range: 1.0
